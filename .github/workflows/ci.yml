name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: make CC=${{ matrix.compiler }} test
      - name: Build benchmark
        run: make CC=${{ matrix.compiler }} build/bench
